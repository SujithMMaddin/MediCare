spring.application.name=medicare-backend
server.port=8081

# ---------- MySQL ----------
# createDatabaseIfNotExist=true creates medicare_db automatically on first run
spring.datasource.url=jdbc:mysql://localhost:3306/medicare_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Base64 encoded secret (must decode to at least 32 bytes). Override with JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:bWVkaWNhcmUtc3VwZXItc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctbWluaW11bS0yNTYtYml0cy1sb25nIQ==}
# 24 hours in milliseconds
app.jwt.expiration-ms=86400000

# ---------- CORS (Angular dev server) ----------
app.cors.allowed-origins=http://localhost:4200

# ---------- Default admin (seeded on first start) ----------
app.admin.name=System Admin
app.admin.email=admin@medicare.com
app.admin.password=Admin@123

# ---------- Jackson ----------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Appointment booking protections ----------
medicare.booking.max-active-appointments=${MEDICARE_MAX_ACTIVE_APPOINTMENTS:3}
medicare.booking.cooldown-seconds=${MEDICARE_BOOKING_COOLDOWN_SECONDS:10}
